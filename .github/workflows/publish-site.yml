name: Publish Project Odisha

on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: 'Founder has approved this main-branch coastal edition for public release'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == 'ahimanikya' && inputs.publish_approved
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    defaults:
      run:
        working-directory: projects/site
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/site/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run build:coast
      - run: npm run test:coast
      - run: npm run build:publication
      - uses: actions/upload-pages-artifact@v5
        with:
          path: projects/site/dist-publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved website
        id: deployment
        uses: actions/deploy-pages@v5
