name: Publish Project Odisha

on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: 'Founder has approved this main-branch coastal edition for public release'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == 'ahimanikya' && inputs.publish_approved
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
    defaults:
      run:
        working-directory: projects/site
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/site/package-lock.json
      - uses: actions/configure-pages@v6
      - run: npm ci
      - name: Verify release PDF delivery guards
        run: python3 tests/test_dhaga_pdf_delivery.py
      - name: Hydrate exact reviewed Dhaga release PDF
        env:
          RUN_AUTHORIZED_PDF_HYDRATION: '1'
        run: python3 tools/verify-dhaga-pdf.py --descriptor ../odia-dhaga/pdf-delivery.json --packing ../odia-dhaga/packing-report.json --target ../odia-dhaga/odia-dhaga-book.pdf
      - run: npm run build
      - run: node tools/check-public-disclosures.mjs dist
      - run: npm test
      - run: npm run build:coast
      - run: node tools/check-public-disclosures.mjs dist-coast
      - run: npm run test:coast
      - run: npm run build:publication
      - run: node tools/check-public-disclosures.mjs dist-publish
      - name: Check Pages payload before upload
        working-directory: .
        run: |
          python3 tools/tests/test_check_pages_payload.py
          python3 tools/check_pages_payload.py projects/site/dist-publish
      - uses: actions/upload-pages-artifact@v5
        with:
          path: projects/site/dist-publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish approved website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Record Pages status after deployment failure
        if: failure() && steps.deployment.outcome == 'failure'
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          endpoint = f"repos/{os.environ['GITHUB_REPOSITORY']}/pages/deployments/{os.environ['GITHUB_SHA']}"
          result = {"deployment_sha": os.environ["GITHUB_SHA"], "run_id": os.environ["GITHUB_RUN_ID"]}
          try:
              response = subprocess.run(["gh", "api", "--include", endpoint], capture_output=True, text=True, timeout=20)
              headers, _, body = response.stdout.replace("\r\n", "\n").partition("\n\n")
              result["api_exit_code"] = response.returncode
              result["http_status_line"] = next((line for line in headers.splitlines() if line.startswith("HTTP/")), None)
              result["request_id"] = next((line.split(":", 1)[1].strip() for line in headers.splitlines() if line.lower().startswith("x-github-request-id:")), None)
              try:
                  payload = json.loads(body)
                  status = payload.get("status") if isinstance(payload, dict) else None
                  result["pages_status"] = status[:200] if isinstance(status, str) else None
              except ValueError:
                  result["pages_status"] = None
                  result["response_json_valid"] = False
          except subprocess.TimeoutExpired:
              result["diagnostic_timeout_seconds"] = 20
          # Only allowlisted fields: never print token, OIDC, full headers, body or stderr.
          print(json.dumps(result, ensure_ascii=True, indent=2))
          PYTHON
