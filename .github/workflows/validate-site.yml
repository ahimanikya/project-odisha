name: Review coastal candidate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coastal-review-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: projects/site/package-lock.json
      - name: Install locked site dependencies
        run: npm ci
        working-directory: projects/site
      - name: Validate project knowledge and authority records
        run: |
          python3 tools/registers.py --check
          python3 tools/catalog.py --check
          python3 tools/check_bundle.py
          python3 tools/test_registers.py
          python3 tools/test_config.py
          python3 tools/test_project_prefix.py
          python3 tools/test_family_id_aliases.py
          (cd projects/store && python3 tools/test_project_prefix.py && python3 tools/registers.py --check && python3 tools/check_bundle.py)
          python3 tools/check_autonomous_program.py
          python3 tools/editorial/article_rollout.py --check
          python3 tools/check_team_assignments.py
          python3 tools/test_team_assignments.py
          python3 tools/test_autonomous_program.py
          python3 tools/check_sound_collection.py
          python3 tools/test_sound_collection.py
      - name: Install and validate Store candidate
        working-directory: projects/store
        run: |
          npm ci
          npm run build
          npm test
          npm run test:server
      - name: Validate imported research collection
        run: |
          python3 tools/research/reindex.py
          git diff --exit-code -- kb/research/search-index.json
          python3 tools/research/validate.py
          python3 tools/research/validate_visitor_index.py
          python3 tools/research/validate_maritime.py
          python3 tools/research/validate_growth_journeys.py
          python3 tools/research/validate_statistics.py
          python3 tools/research/validate_homestays.py
          python3 tools/research/validate_classification.py
          python3 tools/research/validate_collections.py
          python3 tools/research/validate_prd.py
          python3 tools/research/validate_creations.py
          python3 tools/research/validate_sports.py
          python3 tools/research/validate_research_map.py
          python3 tools/research/validate_osha_culture.py
          python3 tools/research/validate_seasonal_food.py
      - name: Reconcile official language population tables
        run: python3 tools/languages/build_atlas.py --check
      - name: Check internal editorial workbench
        run: |
          python3 tools/editorial/build_workbench.py --check
          python3 tools/editorial/test_workbench.py
          node --test projects/editorial-workbench/workbench.test.mjs
      - name: Build and test full draft
        run: |
          npm run build
          npm test
        working-directory: projects/site
      - name: Build review gallery and test shared design system
        run: |
          npm run review
          npm test
        working-directory: projects/design-system
      - name: Build and verify coastal edition
        env:
          PUBLIC_GA_MEASUREMENT_ID: ${{ vars.PUBLIC_GA_MEASUREMENT_ID }}
        run: |
          npm run build:coast
          npm run test:coast
          python3 tools/audit-coast.py
          python3 tools/audit-discovery.py
          node tools/prepare-search-review.mjs
          python3 tools/audit-launch-readiness.py
          npm run build:publication
          python3 tools/audit-search-shortlist.py
        working-directory: projects/site
      - name: Save coastal files for review
        uses: actions/upload-artifact@v7
        with:
          name: coastal-review-${{ github.sha }}
          path: projects/site/dist-coast
          retention-days: 14
          if-no-files-found: error
