<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1030" viewBox="0 0 760 1030" role="img" aria-labelledby="title desc">
<title id="title">Three questions for reading a sung poem</title>
<desc id="desc">An original explanatory reading aid distinguishes the character's voice, the poet's signature and the performer's rendition. It asks who speaks within the poem, where a poet names or marks a presence, and how a performer interprets the work. These layers may meet without being the same voice.</desc>
<rect width="760" height="1030" fill="#faf6ed"/>
<rect x="20" y="20" width="720" height="990" rx="6" fill="none" stroke="#d8cdbb"/>
<g fill="#633844" font-family="Georgia, 'Times New Roman', serif">
<text x="52" y="77" font-size="17" letter-spacing="2">READING A SUNG POEM</text>
<text x="52" y="132" font-size="39">Whose voice do we hear?</text>
</g>
<g font-family="Arial, Helvetica, sans-serif">
<g fill="#efe4d4"><rect x="52" y="178" width="656" height="211" rx="10"/><rect x="52" y="427" width="656" height="211" rx="10"/><rect x="52" y="676" width="656" height="211" rx="10"/></g>
<g fill="#854756" font-size="18" letter-spacing="2"><text x="78" y="218">01 · WITHIN THE POEM</text><text x="78" y="467">02 · THE POET’S PRESENCE</text><text x="78" y="716">03 · IN PERFORMANCE</text></g>
<g fill="#633844" font-family="Georgia, 'Times New Roman', serif" font-size="34"><text x="78" y="265">Character’s voice</text><text x="78" y="514">Poet’s signature</text><text x="78" y="763">Performer’s rendition</text></g>
<g fill="#4e4844" font-size="23"><text x="78" y="311">Who speaks, and to whom?</text><text x="78" y="350">Attend to the dramatic situation.</text><text x="78" y="560">Where does the poet mark a presence?</text><text x="78" y="599">Inspect the actual words and context.</text><text x="78" y="809">How is this work interpreted?</text><text x="78" y="848">Listen to the credited rendition.</text></g>
<text x="52" y="944" fill="#633844" font-size="22">These layers can meet within one song.</text>
<text x="52" y="979" fill="#655b54" font-size="21">They need not belong to the same speaking voice.</text>
</g>
</svg>
