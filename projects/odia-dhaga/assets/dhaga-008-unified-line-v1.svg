<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" role="img" aria-labelledby="title desc">
<title id="title">Planting takes time before the harvest</title><desc id="desc">An upper sequence shows planting, growing, and readiness before a need. A lower sequence starts planting at the moment of need and cannot supply the result in time. No actual growing duration is stated.</desc>
<rect width="900" height="400" rx="12" fill="#ffffff"/>
<g font-family="sans-serif" fill="#222222"><text x="35" y="42" font-size="22" font-weight="bold">Preparation has a lead time</text><text x="35" y="78" font-size="16">The plant is a metaphor for work that cannot be rushed at the last moment.</text></g>
<path d="M120 170H780" stroke="#222222" stroke-width="4"/><path d="M120 296H780" stroke="#222222" stroke-width="4"/>
<path d="M760 106V334" stroke="#222222" stroke-dasharray="6 5" stroke-width="2"/>
<g fill="#222222"><circle cx="120" cy="170" r="8"/><circle cx="380" cy="170" r="8"/><circle cx="640" cy="170" r="8"/></g>
<g stroke="#222222" stroke-width="4" fill="#ffffff"><path d="M120 155v-24m0 12q-28 0-22-16 22 0 22 16m0-3q24 0 20-18-20 1-20 18"/><path d="M380 154v-51m0 33q-35-3-29-22 27 0 29 22m0-16q32-1 26-22-25 2-26 22"/></g>
<path d="M624 114q-18 24 1 35 33 16 40-26 0-22-24-15" fill="#ffffff" stroke="#222222" stroke-width="3"/><path d="m641 111 3-14m-17 16 17-7 11 9" stroke="#222222" fill="none" stroke-width="4"/>
<g font-family="sans-serif" text-anchor="middle" fill="#222222" font-size="18"><text x="120" y="203">Plant</text><text x="380" y="203">Grow</text><text x="640" y="203">Ready</text><text x="760" y="125" fill="#222222">Needed</text></g>
<circle cx="760" cy="296" r="9" fill="#222222"/><g font-family="sans-serif" fill="#222222"><text x="35" y="263" font-size="18">Starting only when the result is needed…</text><text x="760" y="326" font-size="18" text-anchor="middle" fill="#222222">Planting now is too late</text><text x="35" y="374" font-size="14" fill="#222222">Illustrative sequence only. No farming schedule or historical wedding custom is asserted.</text></g>
</svg>
