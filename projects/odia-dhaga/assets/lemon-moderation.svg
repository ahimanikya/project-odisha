<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">A useful action can be taken too far</title><desc id="desc">Three stages move from starting a useful action, through enough, to overdoing it. Lemon slices mark the metaphor, not a scientific measurement.</desc>
<rect width="900" height="350" rx="12" fill="#f1eddd"/>
<path d="M145 190H755" stroke="#abb8aa" stroke-width="5"/><path d="m742 181 16 9-16 9" fill="none" stroke="#abb8aa" stroke-width="4"/>
<g stroke="#9a7433" stroke-width="3" fill="#e9c85d"><circle cx="150" cy="110" r="42"/><circle cx="450" cy="110" r="42"/><circle cx="750" cy="110" r="42"/></g>
<g fill="none" stroke="#fff6c7" stroke-width="3"><circle cx="150" cy="110" r="33"/><path d="M117 110h66m-33-33v66m-24-57 48 48m0-48-48 48"/><circle cx="450" cy="110" r="33"/><path d="M417 110h66m-33-33v66m-24-57 48 48m0-48-48 48"/><circle cx="750" cy="110" r="33"/><path d="M717 110h66m-33-33v66m-24-57 48 48m0-48-48 48"/></g>
<circle cx="150" cy="190" r="9" fill="#728875"/><circle cx="450" cy="190" r="12" fill="#346452"/><circle cx="750" cy="190" r="9" fill="#a95036"/>
<g font-family="sans-serif" text-anchor="middle" fill="#243b3b"><text x="150" y="240" font-size="23">Begin</text><text x="450" y="240" font-size="23" font-weight="bold">Enough</text><text x="750" y="240" font-size="23">Too much</text><text x="150" y="272" font-size="17">A useful action</text><text x="450" y="272" font-size="17">Know when to stop</text><text x="750" y="272" font-size="17">The benefit can be lost</text><text x="450" y="320" font-size="14" fill="#536461">A contemporary reading of the saying — not a test of lemon chemistry.</text></g>
</svg>
