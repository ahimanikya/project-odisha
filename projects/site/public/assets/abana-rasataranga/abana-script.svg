<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1040" viewBox="0 0 760 1040" role="img" aria-labelledby="title desc"><title id="title">Four distinctions in Odia script</title><desc id="desc">Odia examples: ka as a base consonant, kaa as consonant with dependent vowel sign, independent vowel i, and the conjunct shwa. Script distinctions only, not a pronunciation guide or a manuscript facsimile.</desc><rect width="760" height="1040" fill="#faf6ed"/><text x="48" y="75" font-family="Georgia,serif" font-size="38" fill="#633844">Look closely at the script.</text><rect x="48" y="120" width="664" height="164" rx="10" fill="#efe4d4"/><text x="82" y="230" font-family="Noto Sans Oriya, Oriya Sangam MN, Oriya MN" font-size="78" fill="#633844">କ</text><text x="230" y="189" font-family="Arial,sans-serif" font-size="25" fill="#633844">Base consonant</text><text x="230" y="231" font-family="Arial,sans-serif" font-size="20" fill="#655b54">U+0B15</text><rect x="48" y="310" width="664" height="164" rx="10" fill="#efe4d4"/><text x="82" y="420" font-family="Noto Sans Oriya, Oriya Sangam MN, Oriya MN" font-size="78" fill="#633844">କା</text><text x="230" y="379" font-family="Arial,sans-serif" font-size="25" fill="#633844">Consonant + dependent vowel sign</text><text x="230" y="421" font-family="Arial,sans-serif" font-size="20" fill="#655b54">U+0B15 + U+0B3E</text><rect x="48" y="500" width="664" height="164" rx="10" fill="#efe4d4"/><text x="82" y="610" font-family="Noto Sans Oriya, Oriya Sangam MN, Oriya MN" font-size="78" fill="#633844">ଇ</text><text x="230" y="569" font-family="Arial,sans-serif" font-size="25" fill="#633844">Independent vowel</text><text x="230" y="611" font-family="Arial,sans-serif" font-size="20" fill="#655b54">U+0B07</text><rect x="48" y="690" width="664" height="164" rx="10" fill="#efe4d4"/><text x="82" y="800" font-family="Noto Sans Oriya, Oriya Sangam MN, Oriya MN" font-size="78" fill="#633844">ଶ୍ୱ</text><text x="230" y="759" font-family="Arial,sans-serif" font-size="25" fill="#633844">Conjunct</text><text x="230" y="801" font-family="Arial,sans-serif" font-size="20" fill="#655b54">U+0B36 + U+0B4D + U+0B71</text><g font-family="Arial,sans-serif" font-size="23" fill="#655b54"><text x="48" y="943">Script distinctions, not a pronunciation guide</text><text x="48" y="982">or manuscript facsimile.</text></g></svg>