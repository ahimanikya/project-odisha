<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780" role="img" aria-labelledby="title desc">
<title id="title">Two questions for reading poetic craft</title>
<desc id="desc">An original reading aid contrasts attention to sound, by noticing a repeated opening, with attention to meaning, by noticing what is compared. It does not quote or reconstruct a poem.</desc>
<rect width="700" height="780" fill="#faf6ed"/><rect x="20" y="20" width="660" height="740" rx="6" fill="none" stroke="#d8cdbb"/>
<g fill="#633844" font-family="Georgia, 'Times New Roman', serif"><text x="48" y="78" font-size="17" letter-spacing="2">READING POETIC CRAFT</text><text x="48" y="135" font-size="39">Listen. Then compare.</text></g>
<rect x="48" y="181" width="604" height="218" rx="10" fill="#efe4d4"/><rect x="48" y="433" width="604" height="218" rx="10" fill="#efe4d4"/>
<g font-family="Arial, Helvetica, sans-serif"><g fill="#854756" font-size="19" letter-spacing="2"><text x="74" y="225">SOUND</text><text x="74" y="477">MEANING</text></g>
<g fill="#633844" font-family="Georgia, 'Times New Roman', serif" font-size="37"><text x="74" y="279">Notice the</text><text x="74" y="327">repeated opening.</text><text x="74" y="531">Notice what</text><text x="74" y="579">is compared.</text></g>
<g fill="#655b54" font-size="24"><text x="74" y="371">Return to the actual words.</text><text x="74" y="623">Follow the relationship they create.</text><text x="48" y="710">Two starting questions, not a complete theory.</text></g></g>
</svg>
