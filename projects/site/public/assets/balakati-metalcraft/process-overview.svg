<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1100" viewBox="0 0 720 1100" role="img" aria-labelledby="title desc"><title id="title">An overview of the brass process</title><desc id="desc">Four stages: brass scrap, melting, casting, forming and finishing. An illustrative process overview based on TERI's 2016 Balakati cluster profile, not complete workshop instructions or a manjira-specific process.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#854756" stroke-width="1.4"/></marker></defs><rect width="720" height="1100" fill="#faf6ed"/><g fill="#633844" font-family="Georgia,serif"><text x="48" y="72" font-size="17" letter-spacing="2">BALAKATI · BRASS CRAFT</text><text x="48" y="129" font-size="38">From metal to an object</text></g><rect x="48" y="180" width="624" height="140" rx="10" fill="#efe4d4"/><text x="76" y="228" fill="#854756" font-family="Arial,sans-serif" font-size="18">01</text><text x="76" y="277" fill="#633844" font-family="Georgia,serif" font-size="30">Brass scrap</text><path d="M360 331V354" fill="none" stroke="#854756" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="365" width="624" height="140" rx="10" fill="#efe4d4"/><text x="76" y="413" fill="#854756" font-family="Arial,sans-serif" font-size="18">02</text><text x="76" y="462" fill="#633844" font-family="Georgia,serif" font-size="30">Melting</text><path d="M360 516V539" fill="none" stroke="#854756" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="550" width="624" height="140" rx="10" fill="#efe4d4"/><text x="76" y="598" fill="#854756" font-family="Arial,sans-serif" font-size="18">03</text><text x="76" y="647" fill="#633844" font-family="Georgia,serif" font-size="30">Casting</text><path d="M360 701V724" fill="none" stroke="#854756" stroke-width="2" marker-end="url(#arrow)"/><rect x="48" y="735" width="624" height="140" rx="10" fill="#efe4d4"/><text x="76" y="783" fill="#854756" font-family="Arial,sans-serif" font-size="18">04</text><text x="76" y="832" fill="#633844" font-family="Georgia,serif" font-size="30">Forming and finishing</text><g fill="none" stroke="#95733f" stroke-width="3"><path d="M552 217l35 8-9 32-35-8z M595 237l30-8 8 33-30 8z"/><path d="M548 415h85l-15 49h-55z M565 404q-10-10 0-20 M589 404q-10-10 0-20 M613 404q-10-10 0-20"/><path d="M549 593h78v47h-78z M558 584h78v47 M627 593l9-9"/><path d="M551 780q5 45 38 45t38-45 M551 780q38 13 76 0"/></g><g fill="#655b54" font-family="Arial,sans-serif" font-size="23"><text x="48" y="953">Illustrative process overview · TERI, 2016.</text><text x="48" y="997">Not complete workshop instructions.</text><text x="48" y="1037">Not a manjira-specific making sequence.</text></g></svg>