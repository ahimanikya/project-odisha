<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1080" viewBox="0 0 900 1080" role="img" aria-labelledby="title desc">
  <title id="title">Following a lyric into Odissi abhinaya</title>
  <desc id="desc">An explanatory diagram connects lyric and dramatic situation with music, expressive performance and the audience's aesthetic experience. Bhava names represented states, abhinaya their dramatic communication, and rasa aesthetic experience. The connections invite attention; they do not guarantee a particular audience response.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#854352" stroke-width="1.5"/></marker></defs>
  <rect width="900" height="1080" fill="#faf6ed"/>
  <rect x="24" y="24" width="852" height="1032" rx="4" fill="none" stroke="#ded1bd"/>
  <g fill="#59313c" font-family="Georgia, 'Times New Roman', serif">
    <text x="64" y="88" font-size="18" letter-spacing="3">A WAY INTO THE PERFORMANCE</text>
    <text x="64" y="146" font-size="43">Following a lyric</text>
    <text x="64" y="193" font-size="43">into expression</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="64" y="240" width="458" height="204" rx="12" fill="#f0e6d8"/>
    <rect x="548" y="240" width="288" height="204" rx="12" fill="#f0e6d8"/>
    <g fill="#59313c" font-family="Georgia, 'Times New Roman', serif" font-size="31"><text x="88" y="289">Lyric &amp; situation</text><text x="572" y="289">Music</text></g>
    <g fill="#4e4844" font-size="23"><text x="88" y="331">Who speaks? To whom?</text><text x="88" y="368">What has happened?</text><text x="572" y="331">Phrase, rhythm,</text><text x="572" y="368">pace &amp; repetition</text></g>
    <text x="88" y="416" fill="#854352" font-size="21">BHAVA · represented states</text>
    <g fill="none" stroke="#854352" stroke-width="2" marker-end="url(#arrow)"><path d="M293 460C293 492 400 476 400 510"/><path d="M692 460C692 492 500 476 500 510"/></g>
    <rect x="64" y="531" width="772" height="205" rx="12" fill="#854352"/>
    <g fill="#fffaf1"><text x="92" y="578" font-size="20" letter-spacing="2">ABHINAYA · DRAMATIC COMMUNICATION</text><text x="92" y="628" font-family="Georgia, 'Times New Roman', serif" font-size="35">The expressive performer</text><text x="92" y="673" font-size="23">Glance, gesture, face &amp; body in relation to the work</text><text x="92" y="710" font-size="21">Attend to the passage as a whole.</text></g>
    <path d="M450 753V802" stroke="#854352" stroke-width="2" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
    <rect x="64" y="825" width="772" height="143" rx="12" fill="#f0e6d8"/>
    <text x="92" y="868" fill="#854352" font-size="21">RASA · AESTHETIC EXPERIENCE</text>
    <text x="92" y="916" fill="#59313c" font-family="Georgia, 'Times New Roman', serif" font-size="33">The audience’s encounter with the work</text>
    <text x="64" y="1010" fill="#655b54" font-size="20">An invitation to attention, not a formula for a guaranteed response.</text>
  </g>
</svg>
