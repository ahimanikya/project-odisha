<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title description">
<title id="title">Two catalogued Ganjapa packs</title>
<desc id="description">Plain rectangular and circular shapes accompany labels for two catalogued packs. These are schematic shapes, not reproductions of card artwork or dimensions; the article describes the sets.</desc>
<rect width="640" height="620" rx="12" fill="#faf4e8"/>
<g font-family="system-ui, sans-serif" fill="#332d26">
<text x="32" y="48" font-size="30" font-weight="650">Two catalogued Ganjapa packs</text>
<rect x="44" y="117" width="92" height="132" fill="#ead5b7" stroke="#886342" stroke-width="4"/>
<text x="178" y="114" font-size="32" font-weight="650">Dashavatara</text>
<text x="178" y="156" font-size="28">Banamali Mahapatra</text>
<text x="178" y="196" font-size="27">Raghurajpur · 1988</text>
<text x="178" y="242" font-size="30" font-weight="650" fill="#30666a">192 cards · 16 suits</text>
<path d="M32 292H608" stroke="#d5c8b7" stroke-width="2"/>
<circle cx="90" cy="420" r="48" fill="#ead5b7" stroke="#886342" stroke-width="4"/>
<text x="178" y="348" font-size="30" font-weight="650">Ramayana Bicycle</text>
<text x="178" y="386" font-size="30" font-weight="650">Ganjappa</text>
<text x="178" y="428" font-size="28">Satyanarayan Maharana</text>
<text x="178" y="468" font-size="27">Sonepur · 1998</text>
<text x="178" y="514" font-size="30" font-weight="650" fill="#30666a">144 cards · 12 suits</text>
<text x="32" y="582" font-size="24">Shapes only · no card artwork · not to scale</text>
</g>
</svg>
